<?xml version="1.0" encoding="UTF-8"?>
<!-- Flightdeck app icon. A process token (amber) on its flight path from the start event
     up through a gateway: the thing you watch in a cockpit. Designed on a 256 grid so it
     still reads at 16 px: one tile, one bright dot, one path. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a47"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tokenFill" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="0.45" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#e2851a"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="256" height="256" rx="58"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <!-- artificial-horizon arcs: the "deck" -->
    <circle cx="128" cy="300" r="190" fill="none" stroke="#9fc4ff" stroke-opacity="0.10" stroke-width="2"/>
    <circle cx="128" cy="300" r="218" fill="none" stroke="#9fc4ff" stroke-opacity="0.06" stroke-width="2"/>
    <rect x="0" y="0" width="256" height="256" fill="url(#sheen)"/>
  </g>

  <!-- flight path: start event -> curve -> gateway -->
  <path d="M 72 172 C 132 172 76 76 126 76" fill="none" stroke="#dbe9ff" stroke-width="9"
        stroke-linecap="round" stroke-opacity="0.92"/>
  <!-- start event -->
  <circle cx="56" cy="172" r="19" fill="#0b1222" stroke="#dbe9ff" stroke-width="9"/>
  <!-- gateway (diamond), slightly open: the decision ahead -->
  <g transform="translate(186 76) rotate(45)">
    <rect x="-27" y="-27" width="54" height="54" rx="7" fill="#0b1222" stroke="#3ddbd9" stroke-width="9"/>
  </g>
  <!-- arrowhead into the gateway -->
  <path d="M 124 61 L 146 76 L 124 91 Z" fill="#dbe9ff" fill-opacity="0.92"/>

  <!-- the token, mid-flight, with a glow -->
  <circle cx="106" cy="126" r="22" fill="#ffb547" opacity="0.6" filter="url(#glow)"/>
  <circle cx="106" cy="126" r="17" fill="url(#tokenFill)"/>
  <circle cx="106" cy="126" r="17" fill="none" stroke="#fff3d6" stroke-opacity="0.5" stroke-width="2"/>
</svg>
